---
name: ✨ 功能需求
description: 提出一个新功能或改进建议
title: "[Feature] 简短描述"
labels: ["enhancement"]
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 🔴 高 - 影响核心用户体验
        - 🟡 中 - 有价值的改进
        - 🟢 低 - 锦上添花
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么问题？
      placeholder: "孩子学完一课后没有反馈，不知道掌握情况..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么实现？
      placeholder: "增加一个学习报告页面，显示每课的词汇正确率、练习得分..."

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他方式解决？
